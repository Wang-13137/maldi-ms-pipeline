[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maldi-ms-pipeline"
version = "0.1.0"
description = "MALDI-TOF 代谢组学分析流水线：峰检测、跨样本对齐、特征过滤与机器学习诊断建模"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "王柘童" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "pyyaml>=6.0",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
maldi-ms = "maldi_ms.cli:main"

[tool.setuptools.packages.find]
where = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
